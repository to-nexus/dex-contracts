[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
via-ir = true
optimizer = true
optimizer_runs = 999999
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.5.0/",
    "forge-std/=dependencies/forge-std-1.14.0/src/",
]

# Allow vm.getCode to read V2 artifacts from legacy directory
fs_permissions = [
    { access = "read", path = "./solc_0_8_28/out" }
]

[dependencies]
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
forge-std = "1.14.0"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
single_line_statement_blocks = "single"
sort_imports = true

[lint]
# Ignore test files from lint (config may not work in all Foundry versions)
# Use `forge lint src/` for reliable results
exclude_lints = [
    "erc20-unchecked-transfer",
    "unsafe-typecast",
    "mixed-case-variable",       # allow UPPER_SNAKE_CASE for pseudo-immutables
    "screaming-snake-case-immutable",
    "screaming-snake-case-const",
    "unchecked-call",
]
